<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>SMA Gala Seating</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500;600&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1f2a44;
    --navy-2: #2b3a5c;
    --gold: #c8a96a;
    --gold-soft: #e6d3a8;
    --cream: #efe4d2;
    --blush: #d9a6a1;
    --sage: #7d8f69;
    --bg: #f7f2ea;
    --surface: #ffffff;
    --ink: #1f2a44;
    --muted: #5d6578;
    --line: #e2d8c6;
    --seat-open: #ffffff;
    --seat-taken: #9aa1b2;
    --seat-blocked: #e4ded3;
    --table: #f4ede1;
    --danger: #9b3b33;
    --primary-bg: #1f2a44;
    --primary-ink: #efe4d2;
    --mine-ring: #1f2a44;
    --shadow: 0 1px 2px rgba(31, 42, 68, .06), 0 8px 24px rgba(31, 42, 68, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141b2d; --surface: #1c2540; --ink: #efe4d2; --muted: #b3b8c6; --line: #33405f;
      --seat-open: #1c2540; --seat-taken: #55607a; --seat-blocked: #2a3350; --table: #24304f;
      --danger: #e08a80; --primary-bg: #c8a96a; --primary-ink: #1f2a44; --mine-ring: #efe4d2;
      --shadow: 0 8px 24px rgba(0, 0, 0, .35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #141b2d; --surface: #1c2540; --ink: #efe4d2; --muted: #b3b8c6; --line: #33405f;
    --seat-open: #1c2540; --seat-taken: #55607a; --seat-blocked: #2a3350; --table: #24304f;
    --danger: #e08a80; --primary-bg: #c8a96a; --primary-ink: #1f2a44; --mine-ring: #efe4d2;
    --shadow: 0 8px 24px rgba(0, 0, 0, .35);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 16px/1.5 "Jost", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select { font: inherit; color: inherit; }

  /* ---------- hero, modelled on the save-the-date card ---------- */
  .hero {
    background: var(--navy); color: var(--cream); text-align: center;
    padding: 28px 16px 30px; position: relative;
  }
  .hero-frame {
    max-width: 760px; margin: 0 auto; padding: 22px 16px 20px;
    border: 1px solid rgba(200, 169, 106, .55); outline: 1px solid rgba(200, 169, 106, .3);
    outline-offset: 5px; border-radius: 180px 180px 6px 6px;
  }
  .logo {
    display: block; width: 84px; height: 84px; margin: 0 auto 12px; border-radius: 50%;
    box-shadow: 0 0 0 2px var(--navy), 0 0 0 3px var(--gold);
  }
  .hero .kicker { font: 500 13px "Jost"; letter-spacing: .28em; text-transform: uppercase; color: var(--gold-soft); }
  .hero h1 {
    font: 400 clamp(46px, 9vw, 76px)/1.05 "Pinyon Script", cursive; margin: 6px 0 8px; color: var(--cream);
  }
  .hero .when { font: 600 13px "Jost"; letter-spacing: .25em; text-transform: uppercase; }
  .hero .where { font: 500 15px "Cormorant Garamond", serif; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); margin-top: 4px; }

  @media (max-width: 600px) {
    .hero { padding: 18px 12px 20px; }
    .hero-frame { padding: 16px 10px 14px; border-radius: 120px 120px 6px 6px; }
    .hero .kicker { font-size: 11px; letter-spacing: .16em; }
    .hero .where { font-size: 13px; letter-spacing: .12em; }
    .logo { width: 64px; height: 64px; }
  }
  .demo-bar {
    position: sticky; top: 0; z-index: 5;
    background: var(--gold-soft); color: var(--navy); font-size: 13px; text-align: center; padding: 6px 16px;
  }
  .demo-bar button { background: none; border: 0; text-decoration: underline; cursor: pointer; padding: 0 4px; color: var(--navy); }

  main { max-width: 1180px; margin: 0 auto; padding: 24px 16px 64px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 24px; }
  .narrow { max-width: 560px; margin: 0 auto; }
  h2 { font: 600 28px/1.2 "Cormorant Garamond", serif; margin: 0 0 6px; }
  h2, h3, .hero .where { font-variant-numeric: lining-nums; }
  h3 { font: 600 18px/1.3 "Jost", sans-serif; margin: 0 0 8px; }
  p { margin: 0 0 12px; }
  .muted { color: var(--muted); }
  .fine { font-size: 13px; color: var(--muted); }
  label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 4px; }
  input[type=email], input[type=text], select {
    width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--bg); min-height: 44px;
  }
  input:focus, select:focus, button:focus-visible, [role=button]:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .stack > * + * { margin-top: 14px; }
  .btn {
    min-height: 44px; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: 500;
    border: 1px solid currentColor; background: transparent; color: var(--ink);
  }
  .btn-primary { background: var(--primary-bg); color: var(--primary-ink); border-color: var(--primary-bg); }
  .btn-primary:disabled { opacity: .45; cursor: not-allowed; }
  .btn-link { background: none; border: 0; padding: 6px 0; color: var(--muted); text-decoration: underline; cursor: pointer; min-height: 0; }
  .btn-danger { color: var(--danger); border-color: var(--danger); }
  .actions { display: flex; gap: 10px; justify-content: space-between; flex-wrap: wrap; margin-top: 20px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px;
    font-size: 13px; border: 1px solid var(--line); background: var(--bg);
  }
  .chip.vip { background: var(--navy); color: var(--gold-soft); border-color: var(--gold); }
  .notice { border-left: 3px solid var(--gold); background: var(--bg); padding: 10px 14px; border-radius: 4px; font-size: 14px; }
  .error { color: var(--danger); font-size: 14px; min-height: 1.2em; }

  table.summary { width: 100%; border-collapse: collapse; font-size: 15px; }
  table.summary th { text-align: left; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 6px 8px 6px 0; border-bottom: 1px solid var(--line); }
  table.summary td { padding: 9px 8px 9px 0; border-bottom: 1px solid var(--line); vertical-align: top; }

  .count-picker { display: flex; gap: 8px; flex-wrap: wrap; }
  .count-picker button { min-width: 48px; }
  .count-picker button[aria-pressed=true] { background: var(--primary-bg); color: var(--primary-ink); border-color: var(--primary-bg); }
  .guest-row { display: grid; grid-template-columns: 1fr 220px; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
  @media (max-width: 600px) { .guest-row { grid-template-columns: 1fr; } }

  /* ---------- seat picker ---------- */
  .picker { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; }
  @media (max-width: 900px) { .picker { grid-template-columns: minmax(0, 1fr); } }
  .map-card { padding: 12px; }
  .map-tools { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 4px 6px 10px; font-size: 13px; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; color: var(--muted); }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; vertical-align: -1px; margin-right: 5px; border: 1.5px solid var(--gold); }
  .toggle { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; font-size: 13px; color: var(--muted); }
  .toggle input { width: 16px; height: 16px; accent-color: var(--gold); }
  svg.map { width: 100%; height: auto; display: block; touch-action: manipulation; }
  /* Phones: the whole room squeezed to ~320px makes tables unreadable, so the map keeps a
     legible width and scrolls sideways inside its card (the page itself never scrolls sideways). */
  .map-hint { display: none; }
  @media (max-width: 600px) {
    .map-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -12px; padding: 0 12px 4px; }
    .map-scroll svg.map { min-width: 620px; }
    .map-hint { display: block; font-size: 12px; color: var(--muted); padding: 0 6px 6px; }
  }
  .tbl { cursor: pointer; }
  .tbl .top { fill: var(--table); stroke: var(--line); stroke-width: 1.5; transition: stroke .15s; }
  .tbl.vip .top { stroke: var(--gold); stroke-width: 2.5; }
  .tbl:hover .top, .tbl.open-t .top { stroke: var(--navy); stroke-width: 3; }
  :root[data-theme="dark"] .tbl:hover .top, :root[data-theme="dark"] .tbl.open-t .top { stroke: var(--gold); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tbl:hover .top, :root:not([data-theme="light"]) .tbl.open-t .top { stroke: var(--gold); } }
  .tbl.dim { opacity: .28; }
  .tbl text { fill: var(--ink); font-family: "Jost"; pointer-events: none; }
  .tbl .lbl { font-size: 15px; font-weight: 600; }
  .tbl .sub { font-size: 10px; fill: var(--muted); }
  .seat { stroke-width: 1.5; cursor: pointer; }
  .seat.open { fill: var(--seat-open); stroke: var(--gold); }
  .seat.taken { fill: var(--seat-taken); stroke: var(--seat-taken); cursor: default; }
  .seat.mine { fill: var(--gold); stroke: var(--mine-ring); stroke-width: 2; }
  .seat.blocked { fill: var(--seat-blocked); stroke: var(--seat-blocked); cursor: not-allowed; }
  .seat-num { font-size: 12px; font-weight: 600; text-anchor: middle; dominant-baseline: central; pointer-events: none; fill: var(--ink); }
  .seat-num.on-dark { fill: #fff; }
  .stage rect { fill: var(--primary-bg); }
  .stage text { fill: var(--primary-ink); font: 600 14px "Jost"; letter-spacing: .3em; }
  .floor-note { fill: var(--muted); font: 12px "Jost"; }

  .side { position: sticky; top: 12px; }
  @media (max-width: 900px) { .side { position: static; } }
  .party { list-style: none; margin: 0 0 14px; padding: 0; }
  .party li + li { margin-top: 8px; }
  .party button {
    width: 100%; text-align: left; display: flex; justify-content: space-between; gap: 10px; align-items: center;
    padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); cursor: pointer; min-height: 48px;
  }
  .party button[aria-pressed=true] { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold); }
  .party .where { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .party .where.set { color: var(--ink); font-weight: 500; }
  .detail svg { width: 100%; max-width: 280px; display: block; margin: 0 auto; }
  .who { list-style: none; padding: 0; margin: 8px 0 0; font-size: 14px; max-height: 220px; overflow: auto; }
  .who li { display: flex; gap: 8px; padding: 3px 0; border-bottom: 1px dashed var(--line); }
  .who b { width: 22px; text-align: right; color: var(--muted); font-weight: 500; }

  #toast {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%) translateY(20px); opacity: 0;
    background: var(--navy); color: var(--cream); padding: 10px 18px; border-radius: 8px; font-size: 14px;
    transition: .2s; pointer-events: none; max-width: calc(100% - 32px); z-index: 10; border: 1px solid var(--gold);
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .spinner { text-align: center; padding: 48px 0; color: var(--muted); }
  footer { text-align: center; font-size: 13px; color: var(--muted); padding: 0 16px 32px; }
  footer a { color: inherit; }
</style>
</head>

const $app = document.getElementById('app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const tableOf = seatId => S.data.tables.find(t => t.id === seatId.replace(/-\d+$/, ''));
const seatNo = seatId => +seatId.split('-').pop();
const seatLabel = seatId => { const t = tableOf(seatId); return t ? `${t.label}, seat ${seatNo(seatId)}` : seatId; };
const partySize = () => (S.draft ? S.draft.guests.length : 0);

function prettyDate(ymd, ordinal) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(ymd || '');
  if (!m) return esc(ymd || '');
  const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const d = +m[3];
  const suf = ordinal ? (d % 10 === 1 && d !== 11 ? 'st' : d % 10 === 2 && d !== 12 ? 'nd' : d % 10 === 3 && d !== 13 ? 'rd' : 'th') : '';
  return `${months[+m[2] - 1]} ${d}${suf}, ${m[1]}`;
}

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3800);
}

function go(view) {
  S.view = view;
  S.error = '';
  render();
  if (view !== 'seats') window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ======================================================================
// Boot
// ======================================================================
async function boot() {
  if (!IN_GAS) document.getElementById('demoBar').hidden = false;
  const p = await urlParams();
  S.token = p.t || '';
  try {
    await refresh();
  } catch (e) {
    $app.innerHTML = `<div class="card narrow"><h2>Something went wrong</h2><p>${esc(e.message)}</p></div>`;
    return;
  }
  if (S.token && !S.data.tokenValid) {
    S.token = '';
    S.error = 'That link is no longer valid. Please enter your email to get a new one.';
    S.view = 'find';
  } else {
    S.view = S.token ? 'home' : 'find';
  }
  render();
  setInterval(poll, 30000);
}

async function refresh() {
  S.data = await call('getState', S.token);
  const c = S.data.config;
  document.getElementById('hKicker').textContent = c.eventName;
  document.getElementById('hTitle').textContent = c.eventTitle;
  document.getElementById('hDate').textContent = prettyDate(c.eventDate, true);
  document.getElementById('hVenue').textContent = c.venue;
  document.getElementById('foot').innerHTML = c.contactEmail
    ? `Questions? <a href="mailto:${esc(c.contactEmail)}">${esc(c.contactEmail)}</a>` : '';
}

/** Keeps the map current while a guest is choosing, and frees any draft seat someone else just took. */
async function poll() {
  if (S.view !== 'seats' || S.busy || document.hidden) return;
  try {
    const fresh = await call('getState', S.token);
    S.data = fresh;
    const lost = S.draft.guests.filter(g => g.seatId && fresh.occupied[g.seatId] && !fresh.occupied[g.seatId].mine);
    lost.forEach(g => { g.seatId = ''; });
    if (lost.length) toast(`Another guest just took ${lost.length > 1 ? 'some seats' : 'a seat'} you picked. Please choose again.`);
    render();
  } catch (e) { /* try again next tick */ }
}

// ======================================================================
// Views
// ======================================================================
function render() {
  const v = VIEWS[S.view];
  const sc = document.querySelector('.map-scroll');
  const scrollX = sc ? sc.scrollLeft : 0;
  $app.innerHTML = v ? v() : '';
  const sc2 = document.querySelector('.map-scroll');
  // Keep the sideways position across re-renders; on first show, centre the map on the stage.
  if (sc2) sc2.scrollLeft = sc ? scrollX : (sc2.scrollWidth - sc2.clientWidth) / 2;
  if (S.view === 'find') { const i = document.getElementById('email'); if (i && !S.email) i.focus(); }
}

function summaryTable(list) {
  return `<table class="summary"><thead><tr><th>Guest</th><th>Seat</th><th>Meal</th></tr></thead><tbody>${
    list.map(g => `<tr><td>${esc(g.name)}</td><td>${esc(seatLabel(g.seatId))}</td><td>${esc(g.meal)}</td></tr>`).join('')
  }</tbody></table>`;
}

// ======================================================================
// Seat map
// ======================================================================
function seatState(seatId, t) {
  const i = S.draft ? S.draft.guests.findIndex(g => g.seatId === seatId) : -1;
  if (i >= 0) return { cls: 'mine', who: S.draft.guests[i].name };
  const o = S.data.occupied[seatId];
  if (o && !o.mine) return { cls: 'taken', who: o.name };
  if (t.vip && !S.data.invite.vip) return { cls: 'blocked', who: '' };
  return { cls: 'open', who: '' };
}

function openCount(t) {
  let n = 0;
  for (let s = 1; s <= t.seats; s++) if (seatState(`${t.id}-${s}`, t).cls === 'open') n++;
  return n;
}

function seatPos(cx, cy, r, i, n) {
  const a = -Math.PI / 2 + (2 * Math.PI * i) / n;
  return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
}

function mapSvg() {
  const T = S.data.tables;
  const xs = T.map(t => t.x), ys = T.map(t => t.y);
  const minX = Math.min(...xs) - 70, maxX = Math.max(...xs) + 70;
  const stageY = Math.min(...ys) - 150;
  const maxY = Math.max(...ys) + 100;
  const cx = (minX + maxX) / 2;
  const need = partySize();
  const tables = T.map(t => {
    const open = openCount(t);
    const dim = (t.vip && !S.data.invite.vip) || (S.roomOnly && open < need);
    const seats = Array.from({ length: t.seats }, (_, i) => {
      const id = `${t.id}-${i + 1}`;
      const st = seatState(id, t);
      const [x, y] = seatPos(t.x, t.y, 50, i, t.seats);
      const tip = `${t.label}, seat ${i + 1}: ${st.cls === 'taken' ? (st.who || 'Reserved') : st.cls === 'mine' ? st.who : st.cls === 'blocked' ? 'VIP only' : 'Open'}`;
      return `<circle class="seat ${st.cls}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="7" data-seat="${id}"><title>${esc(tip)}</title></circle>`;
    }).join('');
    const short = t.vip ? t.label : t.label.replace(/^Table\s+/i, '');
    return `<g class="tbl ${t.vip ? 'vip' : ''} ${dim ? 'dim' : ''} ${S.openTable === t.id ? 'open-t' : ''}" data-table="${t.id}"
        role="button" tabindex="0" aria-label="${esc(t.label)}, ${open} open seats">
      <circle class="top" cx="${t.x}" cy="${t.y}" r="36"></circle>
      <text class="lbl" x="${t.x}" y="${t.y - 2}" text-anchor="middle">${esc(short)}</text>
      <text class="sub" x="${t.x}" y="${t.y + 14}" text-anchor="middle">${open} open</text>
      ${seats}</g>`;
  }).join('');
  return `<svg class="map" viewBox="${minX} ${stageY - 10} ${maxX - minX} ${maxY - stageY + 10}" role="group" aria-label="Ballroom seating map">
    <g class="stage"><rect x="${cx - 190}" y="${stageY}" width="380" height="46" rx="4"></rect>
      <text x="${cx}" y="${stageY + 28}" text-anchor="middle">STAGE</text></g>
    ${tables}
    <text class="floor-note" x="${cx}" y="${maxY - 8}" text-anchor="middle">Placeholder layout. The final Hilton floor plan may differ.</text>
  </svg>`;
}

function tableDetail(tableId) {
  const t = S.data.tables.find(x => x.id === tableId);
  const R = 100, C = 140;
  const dots = [], who = [];
  for (let i = 0; i < t.seats; i++) {
    const id = `${t.id}-${i + 1}`;
    const st = seatState(id, t);
    const [x, y] = seatPos(C, C, R, i, t.seats);
    const label = st.cls === 'taken' ? (st.who || 'Reserved') : st.cls === 'mine' ? st.who : st.cls === 'blocked' ? 'VIP only' : 'Open';
    dots.push(`<g><circle class="seat ${st.cls}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="17" data-seat="${id}"
        role="button" tabindex="0" aria-label="Seat ${i + 1}, ${esc(label)}"><title>${esc(label)}</title></circle>
      <text class="seat-num ${st.cls === 'taken' ? 'on-dark' : ''}" x="${x.toFixed(1)}" y="${y.toFixed(1)}">${i + 1}</text></g>`);
    if (st.cls === 'taken' || st.cls === 'mine') {
      who.push(`<li><b>${i + 1}</b><span>${esc(st.who || 'Reserved')}${st.cls === 'mine' ? ' (your party)' : ''}</span></li>`);
    }
  }
  const open = openCount(t);
  return `<div class="row" style="justify-content:space-between"><h3 style="margin:0">${esc(t.label)}</h3>
      <button class="btn-link" data-action="close-table" aria-label="Close table view">Close</button></div>
    <p class="fine">${t.vip ? 'VIP table in front of the stage. ' : ''}${open} of ${t.seats} seats open. Tap an open seat.</p>
    <svg viewBox="0 0 280 280" class="map" aria-label="${esc(t.label)} seats">
      <circle cx="${C}" cy="${C}" r="62" fill="var(--table)" stroke="${t.vip ? 'var(--gold)' : 'var(--line)'}" stroke-width="2"></circle>
      <text x="${C}" y="${C + 6}" text-anchor="middle" style="font:600 18px Jost;fill:var(--ink)">${esc(t.label)}</text>
      ${dots.join('')}
    </svg>
    ${who.length ? `<ul class="who">${who.join('')}</ul>` : '<p class="fine" style="text-align:center">No one has reserved here yet.</p>'}`;
}

function pickSeat(seatId) {
  const t = tableOf(seatId);
  const st = seatState(seatId, t);
  const g = S.draft.guests;
  if (st.cls === 'blocked') return toast('VIP tables are reserved for VIP ticket holders.');
  if (st.cls === 'taken') return toast(st.who ? `Seat ${seatNo(seatId)} is reserved by ${st.who}.` : 'That seat is reserved.');
  if (st.cls === 'mine') {
    const i = g.findIndex(x => x.seatId === seatId);
    g[i].seatId = '';
    S.active = i;
    return render();
  }
  let i = S.active;
  if (g[i].seatId && g.some(x => !x.seatId)) i = g.findIndex(x => !x.seatId);
  g[i].seatId = seatId;
  const next = g.findIndex(x => !x.seatId);
  S.active = next >= 0 ? next : i;
  render();
}

// ======================================================================
// Events
// ======================================================================
$app.addEventListener('submit', async e => {
  if (e.target.id !== 'findForm') return;
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  S.email = email;
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { S.error = 'Please enter a valid email address.'; return render(); }
  S.busy = true; S.error = ''; render();
  try {
    const r = await call('requestLink', email);
    S.busy = false;
    if (!r.ok) { S.error = r.message; return render(); }
    if (r.token) { S.token = r.token; await refresh(); return go('home'); }
    S.demoToken = r.demoToken || '';
    go('sent');
  } catch (err) { S.busy = false; S.error = err.message; render(); }
});

$app.addEventListener('input', e => {
  const f = e.target.dataset.field;
  if (f && S.draft) S.draft.guests[+e.target.dataset.i][f] = e.target.value;
});
$app.addEventListener('change', e => {
  const f = e.target.dataset.field;
  if (f && S.draft) S.draft.guests[+e.target.dataset.i][f] = e.target.value;
  if (e.target.dataset.action === 'room') { S.roomOnly = e.target.checked; render(); }
});

$app.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && (e.target.dataset.seat || e.target.dataset.table)) {
    e.preventDefault();
    e.target.dispatchEvent(new MouseEvent('click', { bubbles: true }));
  }
});

$app.addEventListener('click', async e => {
  let seat = e.target.closest('[data-seat]');
  // On touch screens the room-map seat dots are too small to aim at, so a tap there opens the
  // table instead of booking a seat. Seats are booked only in the large table view.
  if (seat && !seat.closest('.detail') && matchMedia('(pointer: coarse), (max-width: 900px)').matches) seat = null;
  if (seat && S.view === 'seats') {
    S.openTable = seat.dataset.seat.replace(/-\d+$/, '');
    return pickSeat(seat.dataset.seat);
  }
  const tbl = e.target.closest('[data-table]');
  if (tbl && S.view === 'seats') {
    S.openTable = tbl.dataset.table;
    render();
    if (window.innerWidth <= 900) document.getElementById('detail').scrollIntoView({ behavior: 'smooth', block: 'start' });
    return;
  }
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const a = btn.dataset.action;
  if (ACTIONS[a]) ACTIONS[a](btn);
});

document.getElementById('demoBar').addEventListener('click', e => {
  if (e.target.dataset.action === 'demo-reset') { Demo.reset(); location.search = ''; location.reload(); }
});

const ACTIONS = {
  'to-find'() { S.token = ''; go('find'); },
  'to-home'() { S.draft = null; go('home'); },
  'to-cancel'() { go('cancel'); },
  'to-guests'() { go('guests'); },
  async 'demo-open'() { S.token = S.demoToken; await refresh(); go('home'); },

  edit() {
    const d = S.data, meals = d.config.meals;
    const base = d.reservation.length
      ? d.reservation.map(g => ({ ...g }))
      : Array.from({ length: d.invite.seats }, () => ({ name: '', meal: '', seatId: '' }));
    if (meals.length === 1) base.forEach(g => { g.meal = g.meal || meals[0]; });
    S.draft = { guests: base };
    S.active = 0;
    S.openTable = null;
    go('guests');
  },
  count(btn) {
    const n = +btn.dataset.n, g = S.draft.guests;
    while (g.length < n) g.push({ name: '', meal: S.data.config.meals.length === 1 ? S.data.config.meals[0] : '', seatId: '' });
    g.length = n;
    render();
  },
  'to-seats'() {
    const g = S.draft.guests, meals = S.data.config.meals;
    g.forEach(x => { x.name = x.name.replace(/\s+/g, ' ').trim(); });
    if (g.some(x => !x.name)) { S.error = 'Please enter a name for every guest.'; return render(); }
    if (meals.length && g.some(x => !meals.includes(x.meal))) { S.error = 'Please choose a meal for every guest.'; return render(); }
    S.active = Math.max(0, g.findIndex(x => !x.seatId));
    if (!S.openTable) {
      const first = g.find(x => x.seatId);
      if (first) S.openTable = tableOf(first.seatId).id;
    }
    go('seats');
    poll();
  },
  activate(btn) { S.active = +btn.dataset.i; const s = S.draft.guests[S.active].seatId; if (s) S.openTable = tableOf(s).id; render(); },
  'close-table'() { S.openTable = null; render(); },
  'to-review'() { go('review'); },

  async save() {
    S.busy = true; render();
    try {
      const r = await call('saveReservation', S.token, S.draft.guests);
      S.busy = false;
      if (r.ok) { S.data = r.state; S.draft = null; return go('done'); }
      if (r.code === 'SEAT_TAKEN') {
        S.data = r.state;
        S.draft.guests.forEach(g => { if (r.seats.includes(g.seatId)) g.seatId = ''; });
        S.active = Math.max(0, S.draft.guests.findIndex(g => !g.seatId));
        toast(r.message);
        return go('seats');
      }
      S.error = r.message; render();
    } catch (err) { S.busy = false; S.error = err.message; render(); }
  },

  async decline() { go('cancel'); },
  async 'confirm-cancel'() {
    S.busy = true; render();
    try {
      const r = await call('cancelReservation', S.token);
      S.busy = false;
      if (!r.ok) { S.error = r.message; return render(); }
      S.data = r.state; S.draft = null;
      toast('Thank you for letting us know.');
      go('home');
    } catch (err) { S.busy = false; S.error = err.message; render(); }
  },
};

// ======================================================================
// Demo backend: mirrors the rules in Code.gs with sample data in this
// browser only. Never used inside Apps Script.
// ======================================================================
const Demo = (() => {
  const KEY = 'smaGalaDemo.v1';
  const config = {
    eventName: "Stella Maris Academy's 80th Anniversary Gala", eventTitle: 'Easter Ball',
    eventDate: '2027-04-24', venue: 'Hilton La Jolla Torrey Pines', rsvpOpen: true,
    lockDate: '2027-04-10', locked: false, showNames: true,
    meals: ['Meal option A (TBD)', 'Meal option B (TBD)', 'Vegetarian (TBD)'],
    requireEmailLink: true, contactEmail: 'gala@example.org', appUrl: '',
  };
  const invites = [
    { id: 'INV-0001', token: 'a1', household: 'The Garcia Family', emails: ['parent@example.com'], type: 'Parent', seats: 2, vip: false },
    { id: 'INV-0002', token: 'b2', household: 'The Nguyen Family', emails: ['vip@example.com'], type: 'Parent', seats: 2, vip: true },
    { id: 'INV-0003', token: 'c3', household: 'Michael Reyes (Class of 1994)', emails: ['alumni@example.com'], type: 'Alumni', seats: 2, vip: false },
    { id: 'INV-0004', token: 'd4', household: 'The Lee Family Foundation', emails: ['donor@example.com'], type: 'Donor', seats: 4, vip: false },
  ];
  const tables = (() => {
    const out = [{ id: 'T1', label: 'VIP 1', vip: true, x: 400, y: 200, seats: 14 }, { id: 'T2', label: 'VIP 2', vip: true, x: 600, y: 200, seats: 14 }];
    let n = 3;
    [350, 490, 630, 770].forEach(y => { for (let c = 0; c < 7; c++) { out.push({ id: 'T' + n, label: 'Table ' + n, vip: false, x: 100 + c * 133, y, seats: 14 }); n++; } });
    return out;
  })();

  function seed() {
    let s = 7;
    const rnd = () => ((s = (s * 16807) % 2147483647) / 2147483647);
    const first = ['Maria', 'James', 'Sofia', 'Daniel', 'Grace', 'Patrick', 'Elena', 'Thomas', 'Claire', 'Matthew', 'Lucia', 'Andrew', 'Teresa', 'John', 'Anna', 'Joseph', 'Rose', 'Peter', 'Catherine', 'Luke'];
    const last = ['Lopez', 'Murphy', 'Chen', 'Russo', 'Kim', 'Okafor', 'Silva', 'Walsh', 'Patel', 'Novak', 'Duarte', 'Brennan', 'Ito', 'Moreno', 'Kelly', 'Haddad'];
    const seats = {};
    let fam = 0;
    tables.forEach(t => {
      const fill = t.vip ? 0.45 : 0.15 + rnd() * 0.7;
      for (let i = 1; i < t.seats; i += 2) {
        if (rnd() < fill) {
          const ln = last[Math.floor(rnd() * last.length)];
          const inv = 'SEED-' + (++fam);
          seats[`${t.id}-${i}`] = { inv, name: `${first[Math.floor(rnd() * first.length)]} ${ln}`, meal: config.meals[0] };
          seats[`${t.id}-${i + 1}`] = { inv, name: `${first[Math.floor(rnd() * first.length)]} ${ln}`, meal: config.meals[1] };
        }
      }
    });
    return { seats, rsvp: {} };
  }
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || seed(); } catch (e) { return seed(); } };
  const store = db => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { /* private mode */ } };
  let db = load();
  const byToken = t => invites.find(i => i.token === t) || null;

  function getState(token) {
    const inv = token ? byToken(token) : null;
    const occupied = {};
    Object.entries(db.seats).forEach(([id, r]) => {
      const mine = !!inv && r.inv === inv.id;
      occupied[id] = { mine, name: mine || (inv && config.showNames) ? r.name : '' };
    });
    const reservation = inv ? Object.entries(db.seats).filter(([, r]) => r.inv === inv.id).map(([seatId, r]) => ({ name: r.name, meal: r.meal, seatId })) : [];
    return {
      config, tables, occupied, reservation,
      invite: inv && { household: inv.household, seats: inv.seats, vip: inv.vip, type: inv.type },
      status: inv ? db.rsvp[inv.id] || '' : '', tokenValid: !token || !!inv,
    };
  }
  function requestLink(email) {
    const inv = invites.find(i => i.emails.includes(email.trim().toLowerCase()));
    return { ok: true, sent: true, demoToken: inv ? inv.token : '' };
  }
  function saveReservation(token, guests) {
    const inv = byToken(token);
    if (!inv) return { ok: false, message: 'This link is no longer valid.' };
    if (guests.length > inv.seats) return { ok: false, message: `Your invitation includes ${inv.seats} seats.` };
    const ids = guests.map(g => g.seatId);
    if (new Set(ids).size !== ids.length) return { ok: false, message: 'Two guests cannot share one seat.' };
    for (const g of guests) {
      const t = tables.find(x => x.id === g.seatId.replace(/-\d+$/, ''));
      if (!g.name.trim()) return { ok: false, message: 'Every seat needs a guest name.' };
      if (!t) return { ok: false, message: `Choose a seat for ${g.name}.` };
      if (t.vip && !inv.vip) return { ok: false, message: `${t.label} is reserved for VIP ticket holders.` };
    }
    const taken = ids.filter(id => db.seats[id] && db.seats[id].inv !== inv.id);
    if (taken.length) return { ok: false, code: 'SEAT_TAKEN', seats: taken, message: 'Another guest just reserved one of your seats. Please choose again.', state: getState(token) };
    Object.keys(db.seats).forEach(id => { if (db.seats[id].inv === inv.id) delete db.seats[id]; });
    guests.forEach(g => { db.seats[g.seatId] = { inv: inv.id, name: g.name.trim(), meal: g.meal }; });
    db.rsvp[inv.id] = 'Attending';
    store(db);
    return { ok: true, state: getState(token) };
  }
  function cancelReservation(token) {
    const inv = byToken(token);
    Object.keys(db.seats).forEach(id => { if (db.seats[id].inv === inv.id) delete db.seats[id]; });
    db.rsvp[inv.id] = 'Not attending';
    store(db);
    return { ok: true, state: getState(token) };
  }
  function reset() { try { localStorage.removeItem(KEY); } catch (e) { /* ignore */ } db = seed(); }
  return { getState, requestLink, saveReservation, cancelReservation, reset };
})();

boot();
</script>
